apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-app-ingress
  namespace: staging
  annotations:
          traefik.ingress.kubernetes.io/rewrite-target /
spec:
  rules:
  - http:
      paths:
      - path: /staging
        pathType: Prefix
        backend:
          service:
            name: sample-app-service
            port:
              number: 80
